<style>
@page { size: A4; margin: 20mm 18mm; }
html { font-size: 11pt; }
body { font-family: "Apple SD Gothic Neo", "AppleGothic", sans-serif; line-height: 1.75; color: #222; max-width: none; }
h1 { font-size: 22pt; border-bottom: 3px solid #8B5E34; padding-bottom: 6px; page-break-before: always; margin-top: 0; }
h1:first-of-type { page-break-before: avoid; }
h2 { font-size: 15pt; color: #6b4524; margin-top: 1.8em; }
h3 { font-size: 12.5pt; color: #3a2a18; }
code { font-family: Menlo, "Apple SD Gothic Neo", monospace; font-size: 9.2pt; background: #f4efe7; padding: 1px 4px; border-radius: 3px; }
pre { background: #f7f3ec; border: 1px solid #e0d4c0; border-left: 4px solid #BE823E; padding: 10px 12px; font-size: 8.8pt; line-height: 1.5; white-space: pre-wrap; word-break: break-all; page-break-inside: avoid; }
pre code { background: none; padding: 0; font-size: inherit; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 10pt; page-break-inside: avoid; }
th, td { border: 1px solid #cdbfa8; padding: 5px 8px; text-align: left; vertical-align: top; }
th { background: #efe5d3; }
blockquote { border-left: 4px solid #3A7D5A; background: #eef5f0; margin: 12px 0; padding: 6px 14px; }
#TOC { page-break-after: always; }
#TOC ul { list-style: none; padding-left: 1.2em; }
header#title-block-header { text-align: center; margin: 80px 0 60px; }
</style>
