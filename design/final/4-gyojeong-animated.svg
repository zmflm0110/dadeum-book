<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="t d">
  <title id="t">다듬 — 밑줄이 체크가 되다</title><desc id="d">틀린 자리에 긋는 밑줄이 한 획으로 이어져 확정(체크)이 되는 마크.</desc>
  <defs>
    <linearGradient id="dd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B4FE8"/><stop offset=".55" stop-color="#232D8F"/><stop offset="1" stop-color="#14224A"/></linearGradient>
    <radialGradient id="dd-hi" cx=".3" cy=".1" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="dd-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#0A1030" flood-opacity=".55"/></filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#dd-bg)"/><rect width="100" height="100" rx="24" fill="url(#dd-hi)"/>
  <g filter="url(#dd-sh)"><path d="M20 70 H40 L52 80 L80 28" fill="none" stroke="#F6F0E0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.7s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </path></g>
</svg>
