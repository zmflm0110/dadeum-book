<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="t d">
  <title id="t">다듬 — 대패밥</title><desc id="d">대패질한 판(널)과 거기서 말려 올라오는 대패밥. 거친 것을 결대로 깎아 반듯하게 다듬는 행위.</desc>
  <defs>
